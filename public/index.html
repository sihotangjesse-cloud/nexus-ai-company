<style>

button:hover{background:linear-gradient(135deg,rgba(82,174,236,.34),rgba(99,120,219,.24));border-color:rgba(101,199,255,.55)}button:active{transform:translateY(1px)}button:disabled{opacity:.55;cursor:wait;transform:none}button.sec{background:rgba(255,255,255,.045);border-color:var(--ln)}

input,select,textarea{width:100%}select option{background:#101c32}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}

a.card{color:inherit;text-decoration:none;display:block}a.card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--shadow)}
.msgs{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px;scrollbar-width:thin;scrollbar-color:rgba(158,175,207,.3) transparent}

.badge{background:var(--wn-soft);color:var(--wn);border:1px solid rgba(245,198,108,.22);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:750;margin-left:6px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#8a9dff)}
.t{border-top:1px solid var(--ln);padding:10px 0}

.task-result summary{cursor:pointer;color:var(--ac);font-size:12px;font-weight:650}
.task-result pre{margin-top:8px;color:var(--tx);white-space:pre-wrap;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cd{min-height:70px;border:1px solid var(--ln);border-radius:10px;padding:5px;font-size:11px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.025)}

.desk{text-align:center;padding:18px 10px}.desk .av{margin:0 auto 8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:13px/1.5 ui-monospace,Menlo,monospace}
.stat-card{position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:112px}.stat-card .stat-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:var(--ac-soft);color:var(--ac);border:1px solid rgba(101,199,255,.16);flex:none}.stat-card .stat-icon svg{width:20px;height:20px}.stat-card .mu{margin-top:7px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));background:#16264b;border:1px solid var(--ac);padding:9px 14px;border-radius:12px;display:none;z-index:9;box-shadow:var(--shadow)}
@media(max-width:800px){.app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:8;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(37px,auto));gap:3px;overflow:visible;padding:6px 7px calc(7px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln-strong);background:rgba(6,13,29,.96);box-shadow:0 -10px 30px rgba(0,0,0,.24);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}nav .nav-brand{display:none}nav a{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;white-space:normal;text-align:center;min-height:37px;padding:3px 2px;margin:0;border-radius:9px;font-size:10px;line-height:1.2;font-weight:600}nav a .nav-icon,nav a .nav-icon svg{width:17px;height:17px}main{padding:14px 14px calc(116px + env(safe-area-inset-bottom,0px))}.topbar{gap:8px;padding-bottom:14px;margin-bottom:18px}.topbar-brand{gap:8px}.topbar-brand .brand-mark{width:33px;height:33px}.topbar-brand strong{font-size:11px}.topbar-brand small{font-size:9px}.status-pill{max-width:55%;padding:7px 9px;font-size:9px;gap:7px}.status-pill small{display:none}.status-indicator{width:7px;height:7px}.cd{min-height:54px;padding:4px;font-size:10px}}
@media(max-width:380px){nav a{font-size:9px}.topbar-brand strong{font-size:10px}.status-pill{font-size:8px;padding:6px 7px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-card{min-height:100px;padding:12px}.stat-card .stat-icon{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Navigasi utama"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const STATIC_DEMO_MODE=location.protocol==='file:';
const STATIC_DEMO_NOTICE='Mode demo offline: data hanya tersimpan di browser ini. Chat AI, delegasi, dan revisi AI dinonaktifkan; tidak ada server, API key, atau kredit yang digunakan.';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='nexus_ai_company_v1';
const BACKUP_FORMAT='nexus-ai-company-backup',BACKUP_VERSION=1,MAX_BACKUP_BYTES=2*1024*1024;
const ST=['Belum dikerjakan','Sedang dikerjakan','Dalam pemeriksaan','Selesai'],PR=['Rendah','Sedang','Tinggi'];
const E=[
{id:'sena',n:'Sena',r:'Team Leader',c:'#4cc3ff',d:'Mengatur pekerjaan tim, memilih spesialis yang relevan, mengumpulkan hasil, dan menyerahkannya kepada CEO untuk ditinjau.',k:['Koordinasi','Delegasi','Quality control','Pelaporan'],sys:'Kamu Sena, Team Leader. Pecah instruksi CEO menjadi tugas dan tunjuk spesialis yang relevan. Hasil spesialis harus ditinjau oleh CEO; jangan mengklaim pemeriksaan otomatis.'},
{id:'nara',n:'Nara',r:'Market Researcher',c:'#4be3a0',d:'Meneliti pasar, menganalisis kompetitor, menemukan peluang, dan memahami kebutuhan pelanggan.',k:['Riset pasar','Analisis kompetitor','Kebutuhan pelanggan'],sys:'Kamu Nara, Market Researcher. Jangan mengarang data. Sebutkan sumber atau nyatakan data belum tersedia.'},
{id:'juno',n:'Juno',r:'Creative Director',c:'#b69cff',d:'Menyusun strategi kreatif, konsep kampanye, dan arah ide konten.',k:['Strategi kreatif','Konsep kampanye','Ide konten'],sys:'Kamu Juno, Creative Director. Beri konsep besar dan arahan untuk tim kreatif.'},
{id:'kata',n:'Kata',r:'Copywriter',c:'#ff9ecf',d:'Menulis iklan, headline, caption, deskripsi produk, dan materi pemasaran.',k:['Iklan','Headline','Caption','Deskripsi produk'],sys:'Kamu Kata, Copywriter. Tulis salinan yang ringkas, jelas, dan sesuai merek.'},
{id:'arka',n:'Arka',r:'Marketing Manager',c:'#ffc857',d:'Menyusun strategi pemasaran, target pelanggan, kampanye, dan evaluasi pertumbuhan.',k:['Strategi pemasaran','Target pelanggan','Kampanye','Evaluasi'],sys:'Kamu Arka, Marketing Manager. Susun strategi bertahap dengan metrik evaluasi.'},
{id:'jejak',n:'Jejak',r:'Business Analyst',c:'#ff8a5c',d:'Menganalisis keuangan, biaya, potensi keuntungan, dan risiko berdasarkan data.',k:['Analisis keuangan','Biaya & keuntungan','Risiko'],sys:'Kamu Jejak, Business Analyst. Jangan mengarang angka keuangan. Minta data atau nyatakan belum tersedia.'},
{id:'garis',n:'Garis',r:'Storyboard Artist',c:'#7fd4ff',d:'Membuat storyboard video, alur cerita, adegan, dan rancangan produksi.',k:['Storyboard','Alur cerita','Konsep visual'],sys:'Kamu Garis, Storyboard Artist. Susun adegan berurutan dengan deskripsi visual.'},
{id:'rupa',n:'Rupa',r:'Art Director',c:'#c9f26b',d:'Menentukan konsep desain, identitas visual, warna, tipografi, dan konsistensi merek.',k:['Identitas visual','Warna & tipografi','Arahan desain'],sys:'Kamu Rupa, Art Director. Tentukan arah visual dan jaga konsistensi merek.'}];
const em=id=>E.find(e=>e.id===id);
let S;
const isRecord=value=>!!value&&typeof value==='object'&&!Array.isArray(value);
const defaultState=()=>({ceo:'Founder',tasks:[],chats:{},events:[],reports:[],log:[]});
function normalizeTask(raw){
 if(!isRecord(raw))return null;
 const st=ST.includes(raw.st)?raw.st:ST[0];
 const history=Array.isArray(raw.h)?raw.h.filter(isRecord).map(item=>({at:Number.isFinite(Number(item.at))?Number(item.at):Date.now(),t:String(item.t||'').slice(0,1000)})).slice(-50):[];
 const rawProgress=Number.isFinite(Number(raw.pg))?Math.max(0,Math.min(100,Math.round(Number(raw.pg)))):0;
 const progress=st===ST[0]?0:st===ST[1]?Math.max(1,Math.min(89,rawProgress||40)):st===ST[2]?90:100;
 const candidateId=Number(raw.id);
 const safeId=Number.isFinite(candidateId)&&candidateId>0?candidateId:Date.now()+Math.random();
 return {id:safeId,t:String(raw.t||'Tugas tanpa judul').slice(0,160),emp:typeof raw.emp==='string'?raw.emp:'unassigned',pri:PR.includes(raw.pri)?raw.pri:'Sedang',due:typeof raw.due==='string'?raw.due:'',st,pg:progress,h:history,result:typeof raw.result==='string'?raw.result.slice(0,12000):'',brief:typeof raw.brief==='string'?raw.brief.slice(0,2000):'',reviewed:raw.reviewed===true&&st===ST[3]};
}
function normalizeState(raw){
 const base=defaultState();
 if(!isRecord(raw))return base;
 const chats={};
 if(isRecord(raw.chats))for(const [key,items] of Object.entries(raw.chats)){
  if(!Array.isArray(items))continue;
  chats[key]=items.filter(isRecord).map(item=>({f:String(item.f||'system').slice(0,40),t:String(item.t||'').slice(0,12000),at:Number.isFinite(Number(item.at))?Number(item.at):Date.now(),demo:item.demo===true})).slice(-300);
 }
 return {
  ceo:typeof raw.ceo==='string'&&raw.ceo.trim()?raw.ceo.trim().slice(0,40):base.ceo,
  tasks:Array.isArray(raw.tasks)?raw.tasks.map(normalizeTask).filter(Boolean).slice(0,500):[],
  chats,
  events:Array.isArray(raw.events)?raw.events.filter(isRecord).map(item=>({id:(Number.isFinite(Number(item.id))&&Number(item.id)>0?Number(item.id):Date.now()+Math.random()),title:String(item.title||'Agenda').slice(0,120),date:typeof item.date==='string'?item.date:'',type:String(item.type||'Agenda').slice(0,40)})).slice(-500):[],
  reports:Array.isArray(raw.reports)?raw.reports.filter(isRecord).map(item=>({title:String(item.title||'Laporan').slice(0,160),body:String(item.body||'').slice(0,20000)})).slice(0,100):[],
  log:Array.isArray(raw.log)?raw.log.filter(isRecord).map(item=>({at:Number.isFinite(Number(item.at))?Number(item.at):Date.now(),t:String(item.t||'').slice(0,500)})).slice(0,40):[]
 };
}
function parseBackupText(text){
 if(typeof text!=='string'||new TextEncoder().encode(text).byteLength>MAX_BACKUP_BYTES)throw new Error('File backup terlalu besar. Batas maksimal 2 MB.');
 let payload;try{payload=JSON.parse(text)}catch(e){throw new Error('File backup bukan JSON yang valid.')}
 if(!isRecord(payload)||payload.format!==BACKUP_FORMAT||payload.version!==BACKUP_VERSION||!isRecord(payload.data))throw new Error('Format backup NEXUS tidak dikenal atau versinya tidak didukung.');
 return normalizeState(payload.data);
}
function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){raw=null}S=normalizeState(raw)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Penyimpanan lokal penuh atau tidak tersedia. Data baru mungkin tidak tersimpan.')}}
function createBackupPayload(){return {format:BACKUP_FORMAT,version:BACKUP_VERSION,appVersion:'0.4.0',exportedAt:new Date().toISOString(),data:normalizeState(S)}}
function downloadBackup(){
 const payload=createBackupPayload();
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');
 link.href=url;
 link.download='nexus-ai-company-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
 toast('Backup JSON berhasil diunduh. Simpan file di tempat aman.');
}
async function importBackupFile(file){
 if(!file)return false;
 if(file.size>MAX_BACKUP_BYTES)throw new Error('File backup terlalu besar. Batas maksimal 2 MB.');
 const restored=parseBackupText(await file.text());
 if(!confirm('Pulihkan backup ini? Data NEXUS saat ini akan diganti dengan isi file backup.'))return false;
 S=restored;
 log('Data dipulihkan dari file backup lokal.');
 save();render();
 toast('Backup berhasil dipulihkan di perangkat ini.');
 return true;
}
function employeeName(id){return em(id)?.n||'Karyawan tidak dikenal'}
function log(t){S.log.unshift({at:Date.now(),t:String(t).slice(0,500)});S.log=S.log.slice(0,40)}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>x.style.display='none',2800)}
const fd=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const av=e=>`<div class="av" style="background:${e.c}">${e.n[0]}</div>`;
const ICONS={
 dashboard:'<rect x="3" y="3" width="8" height="8" rx="1.7"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
 office:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/>',
 tasks:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',

function updateTaskStatus(task,value){
 if(!ST.includes(value))return task;
 task.st=value;
 if(value===ST[0]){task.pg=0;task.reviewed=false;}
 else if(value===ST[1]){task.pg=Math.max(10,Math.min(89,Number(task.pg)||40));task.reviewed=false;}
 else if(value===ST[2]){task.pg=90;task.reviewed=false;}
 else{task.pg=100;task.reviewed=Boolean(task.result);}
 return task;
}
function updateTaskProgress(task,value){
 const progress=Math.max(0,Math.min(100,Math.round(Number(value)||0)));
 if(progress===0){task.pg=0;task.st=ST[0];task.reviewed=false;}
 else if(progress>=100){task.pg=100;task.st=ST[3];task.reviewed=Boolean(task.result);}
 else if(progress>=90){task.pg=90;task.st=ST[2];task.reviewed=false;}
 else{task.pg=progress;task.st=ST[1];task.reviewed=false;}
 return task;
}

try{r=await fetch(path,{method:payload?'POST':'GET',credentials:'same-origin',headers:payload?{'Content-Type':'application/json'}:{},body:payload?JSON.stringify(payload):undefined,...(controller?{signal:controller.signal}:{})});}

function buildHistory(key,message=''){
const allowed=key==='company'?new Set(['ceo',...E.map(e=>e.id)]):new Set(['ceo','sena',key]);
const rows=(S.chats[key]||[]).filter(x=>allowed.has(x.f)).map(x=>{const raw=String(x.t||'');const isAssignment=key==='company'&&x.f!=='ceo'&&x.f!=='sena'&&raw.startsWith('Tugas: ');const role=(x.f==='ceo'||isAssignment||(key!=='company'&&key!=='sena'&&x.f==='sena'))?'user':'model';return {role,text:x.f==='ceo'?raw:`${em(x.f)?.n||'AI'}: ${raw}`}}).slice(-8);
let budget=2600;const bounded=[];
for(let i=rows.length-1;i>=0&&budget>0;i--){const raw=rows[i].text.trim();if(!raw)continue;const take=Math.min(900,budget);const text=raw.slice(0,take);bounded.push({role:rows[i].role,text});budget-=text.length}
let history=bounded.reverse();
// Measure UTF-8 bytes, not JavaScript characters. Keep a safety margin below
// the server's normalized request budget and discard oldest context first.
const payloadSize=()=>new TextEncoder().encode(JSON.stringify({message,history})).length;
while(history.length&&payloadSize()>12000)history.shift();
return history;
}

  }else{

 });

save();render()}

body=`<h2>${d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h2><div class="cal">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="mu">${x}</div>`).join('')}${days.map(x=>x?`<div class="cd ${dk(x)===dk(new Date())?'td':''}" data-a="day" data-d="${dk(x)}"><b>${x.getDate()}</b>${its(dk(x)).map(i=>`<span>${esc(i.n)}</span>`).join('')}</div>`:'<div></div>').join('')}</div>`}
return `<h1>Kalender Aktivitas</h1><div class="row" style="margin-bottom:10px">${['hari','minggu','bulan'].map(m=>`<button class="${cal.m===m?'on':'sec'}" data-a="cm" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}<button class="sec" data-a="cn" data-n="-1">‹ Sebelumnya</button><button class="sec" data-a="cn" data-n="1">Berikutnya ›</button></div>
<div class="g g2"><div class="c">${body}</div><form data-f="ev" class="c"><h2>Tambah agenda</h2><label>Judul</label><input name="t" maxlength="100"><label>Tanggal</label><input type="date" name="d" value="${ds}"><label>Jenis</label><select name="y"><option>Agenda</option><option>Aktivitas</option><option>Jadwal kerja</option></select><div class="err" id="err"></div><button>Simpan agenda</button></form></div>`},
laporan(){const r=makeRep(rep);return `<h1>Laporan Perusahaan</h1><div class="row" style="margin-bottom:10px">${['harian','mingguan'].map(m=>`<button class="${rep===m?'on':'sec'}" data-a="rm" data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}<button data-a="srep">Simpan laporan</button><button class="sec" data-a="crep">Salin teks (ekspor)</button></div>
<div class="g g2"><div class="c"><h2>Produktivitas AI employees</h2>${E.map(e=>{const a=S.tasks.filter(t=>t.emp===e.id),d=a.filter(t=>t.st===ST[3]).length,p=a.length?Math.round(d/a.length*100):0;return `<div class="t"><div class="row"><b>${e.n}</b><span class="mu">${d}/${a.length} selesai</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
<div class="c"><h2>${esc(r.title)}</h2><pre>${esc(r.body)}</pre></div></div>
<div class="c" style="margin-top:12px"><h2>Laporan tersimpan (${S.reports.length})</h2>${S.reports.map((x,i)=>`<div class="t"><b>${esc(x.title)}</b> <button class="sec" data-a="vrep" data-i="${i}">Salin</button></div>`).join('')||'<p class="mu">Belum ada laporan tersimpan.</p>'}</div>`},
pengaturan(){return `<h1>Pengaturan</h1><div class="g g2">
<div class="c"><h2>Backup & Pemulihan Data</h2><p class="mu">Unduh salinan tugas, kalender, laporan, dan data browser sebagai file JSON. File tetap berada di perangkatmu dan tidak dikirim ke server.</p><div class="row"><button type="button" data-a="backup-export">Unduh Backup JSON</button></div><label for="backup-file">Pulihkan dari file backup</label><input id="backup-file" type="file" accept=".json,application/json"><p class="mu">Pemulihan akan mengganti data NEXUS saat ini setelah kamu menyetujuinya. Maksimal ukuran file 2 MB.</p><p class="mu">File backup tidak dienkripsi. Simpan secara pribadi dan jangan bagikan karena dapat berisi catatan kerja.</p></div>
<form data-f="ceo" class="c"><h2>Profil CEO</h2><label>Nama CEO</label><input name="n" maxlength="40" value="${esc(S.ceo)}"><div class="err" id="err"></div><button>Simpan</button></form>
<div class="c"><h2>Mode AI</h2><p><span class="badge">${AI_STATUS.verified?'KONEKSI TERUJI':AI_STATUS.keyConfigured?'API KEY TERPASANG · BELUM DIUJI':'BELUM AKTIF'}</span> ${STATIC_DEMO_MODE?'Mode demo offline. Dashboard, tugas, kalender, dan laporan tersimpan lokal; fitur chat AI memerlukan backend yang belum dihubungkan.':AI_STATUS.verified?'Permintaan AI terakhir berhasil menggunakan model '+esc(AI_STATUS.model||'AI')+'.':AI_STATUS.keyConfigured?'Kunci API tersedia, tetapi koneksi ke Gemini belum dibuktikan. Kirim chat untuk mengujinya.':'AI belum aktif. Jalankan server dan atur GEMINI_API_KEY sebagai environment variable di server. Jangan masukkan kunci API ke halaman ini.'}</p><h2>Data</h2><p class="mu">Data tersimpan di peramban ini (localStorage).</p><button class="sec" data-a="reset">Hapus semua data</button></div></div>`}};
function makeRep(m){const w=m==='harian'?864e5:7*864e5,l=S.log.filter(x=>Date.now()-x.at<w),n=cnt([ST[3]]),q=S.tasks.filter(t=>t.st!==ST[3]).sort((a,b)=>PR.indexOf(b.pri)-PR.indexOf(a.pri)).slice(0,3);
return {title:'Laporan '+m+' · '+new Date().toLocaleDateString('id-ID',{dateStyle:'long'}),body:`Total tugas: ${S.tasks.length}\nSelesai: ${n}\nAktif: ${cnt([ST[1],ST[2]])}\nTertunda: ${cnt([ST[0]])}\n\nAktivitas periode ini (${l.length}):\n${l.slice(0,8).map(x=>'• '+x.t).join('\n')||'• Belum ada aktivitas'}\n\nAnalisis bisnis: data keuangan dan pasar belum tersedia. Jejak dan Nara memerlukan input data sebelum menghasilkan angka.\n\nRekomendasi pekerjaan berikutnya:\n${q.map(t=>'• '+t.t+' ('+employeeName(t.emp)+', '+t.pri+')').join('\n')||'• Beri instruksi baru di Chat Perusahaan'}`}}
function copy(t){const done=()=>toast('Laporan disalin');try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Gagal menyalin. Salin manual dari layar.')}a.remove()}}
function captureFocusedField(){const active=document.activeElement;if(!active||!$('#main').contains(active)||!active.name)return null;const form=active.closest('form[data-f]');if(!form)return null;return {formType:form.dataset.f,key:form.dataset.key||'',name:active.name,start:typeof active.selectionStart==='number'?active.selectionStart:null,end:typeof active.selectionEnd==='number'?active.selectionEnd:null};}
// Every named control that differs from its HTML default is kept across a re-render.
// Controls reset by a successful submit equal their default again, so they are not restored.
const DRAFT_SKIP=new Set(['submit','button','reset','file','hidden','checkbox','radio','image']);
function controlDefault(el){if(el.tagName==='SELECT'){const opts=Array.from(el.options||[]);const d=opts.find(o=>o.defaultSelected)||opts[0];return d?String(d.value):''}return String(el.defaultValue??'')}
function captureFormDrafts(){const root=$('#main');if(!root||typeof root.querySelectorAll!=='function')return [];const drafts=[];for(const form of root.querySelectorAll('form[data-f]')){for(const el of Array.from(form.elements||[])){if(!el.name||DRAFT_SKIP.has(el.type))continue;const value=String(el.value??'');if(value===controlDefault(el))continue;drafts.push({formType:form.dataset.f,key:form.dataset.key||'',name:el.name,value})}}return drafts}
function restoreFormState(drafts,focus){const root=$('#main');if(!root||typeof root.querySelectorAll!=='function')return;const forms=Array.from(root.querySelectorAll('form[data-f]'));const find=(type,key,name)=>{const form=forms.find(x=>x.dataset.f===type&&(x.dataset.key||'')===key);const field=form?.elements?.namedItem?.(name);return field&&!DRAFT_SKIP.has(field.type)?field:null};
for(const d of drafts||[]){const field=find(d.formType,d.key,d.name);if(field)field.value=d.value}
if(focus){const field=find(focus.formType,focus.key,focus.name);if(field&&typeof field.focus==='function'){field.focus();if(focus.start!==null&&typeof field.setSelectionRange==='function'){try{field.setSelectionRange(focus.start,focus.end)}catch(e){}}}}}
function render(){const drafts=captureFormDrafts(),saved=captureFocusedField();
if(AUTH.required&&!AUTH.authenticated&&!AUTH.checked){$('#nav').innerHTML='';$('#main').innerHTML='<div class="card" role="status" aria-live="polite"><p>Memeriksa sesi…</p></div>';return;}
if(AUTH.required&&!AUTH.authenticated){$('#nav').innerHTML='';$('#main').innerHTML=loginView();restoreFormState(drafts,saved);return;}
const h=(location.hash||'#dashboard').slice(1);const v=h.startsWith('k-')&&em(h.slice(2))?'karyawan':(V[h]?h:'dashboard');
$('#nav').innerHTML='<div class="nav-brand"><span class="brand-mark">'+svgIcon('sparkles')+'</span><div><strong>NEXUS AI</strong><small>COMPANY WORKSPACE</small></div></div>'+nav.map(n=>`<a href="#${n[0]}" class="${n[0]===v?'on':''}" ${n[0]===v?'aria-current="page"':''}><span class="nav-icon">${svgIcon(n[2])}</span><span>${n[1]}</span></a>`).join('');
$('#main').innerHTML=topHeader()+(STATIC_DEMO_MODE?`<div class="demo" role="note">${esc(STATIC_DEMO_NOTICE)}</div>`:'')+(h.startsWith('k-')&&em(h.slice(2))?V.emp(h.slice(2)):V[v]());
restoreFormState(drafts,saved);
const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
async function reviseTask(id,note){
 if(STATIC_DEMO_MODE){toast('Revisi AI tidak tersedia pada mode demo offline.');return}
 const key=String(id);const task=S.tasks.find(x=>String(x.id)===key);
 if(!task||!task.result||REVISING.has(key))return;
 const e=em(task.emp);if(!e){toast('Tugas ini belum ditugaskan ke karyawan AI.');return}
 const truncated=task.result.length>6000;
 REVISING.add(key);updateTaskStatus(task,ST[1]);
 task.h.push({at:Date.now(),t:'CEO meminta revisi: '+note.slice(0,300)+(truncated?' (hasil sebelumnya dipotong 6.000 karakter untuk dikirim)':'')});
 save();render();
 try{
  const result=await api('/api/revise',{employeeId:e.id,taskTitle:task.t,taskBrief:task.brief||'',previousResult:task.result.slice(0,6000),note:note.slice(0,2000)});
  markAIVerified(result.model);
  const reply=typeof result.reply==='string'?result.reply.trim():'';
  if(!reply)throw new Error('AI tidak mengembalikan hasil revisi.');
  task.result=reply.slice(0,12000);updateTaskStatus(task,ST[2]);task.reviewed=false;
  task.h.push({at:Date.now(),t:'Revisi diterima dari '+e.n+'. Menunggu pemeriksaan CEO.'});
  push(e.id,'ceo','Catatan revisi: '+note);push(e.id,e.id,reply);
  log('Revisi diterima dari '+e.n+': '+task.t.slice(0,60));
  toast('Revisi diterima. Silakan periksa hasilnya.');
 }catch(error){
  markAIFailed(error);updateTaskStatus(task,ST[2]);task.reviewed=false;
  task.h.push({at:Date.now(),t:'Revisi gagal: '+String(error.message||'Kesalahan tidak diketahui').slice(0,300)+' Hasil sebelumnya dipertahankan.'});
  toast('Revisi gagal. Hasil sebelumnya dipertahankan.');
 }finally{REVISING.delete(key);save();render()}
}
function err(t){const e=$('#err');if(e)e.textContent=t}
document.addEventListener('submit',async ev=>{const f=ev.target;const k=f.dataset.f;if(!k)return;ev.preventDefault();const d=new FormData(f);
if(k==='login'){const password=String(d.get('password')||'');const passwordField=f.elements?.namedItem?.('password');if(passwordField)passwordField.value='';try{await api('/api/login',{password});AUTH.authenticated=true;AUTH.error='';f.reset();await refreshAIStatus();toast('Berhasil masuk.')}catch(e){AUTH.error=e.message;render()}return}
if(k==='revise'){const note=(d.get('note')||'').trim();if(note.length<2){toast('Tulis catatan revisi minimal 2 karakter.');return}const field=f.elements?.namedItem?.('note');if(field)field.value='';await reviseTask(f.dataset.key,note);return}
if(k==='chat'){const b=(d.get('m')||'').trim();if(b.length<2)return err('Tulis pesan minimal 2 karakter.');const key=f.dataset.key;if(BUSY.has(key))return;const history=buildHistory(key,b);const field=f.elements?.namedItem?.('m');if(field)field.value='';BUSY.add(key);render();try{if(key==='company')await delegate(b,history);else await talkToEmployee(key,b,history)}finally{BUSY.delete(key);save();render()}}
else if(k==='task'){const t=(d.get('t')||'').trim(),due=d.get('d');if(t.length<3)return err('Judul tugas minimal 3 karakter.');if(!due)return err('Pilih tenggat waktu.');addTask(t,d.get('e'),d.get('p'),due,ST[0]);log('Tugas baru: '+t);f.reset();save();render();toast('Tugas dibuat')}
else if(k==='ev'){const t=(d.get('t')||'').trim();if(t.length<2)return err('Judul agenda minimal 2 karakter.');if(!d.get('d'))return err('Pilih tanggal.');S.events.push({id:Date.now(),title:t,date:d.get('d'),type:d.get('y')});log('Agenda baru: '+t);f.reset();save();render()}
else if(k==='ceo'){const n=(d.get('n')||'').trim();if(!n)return err('Nama tidak boleh kosong.');S.ceo=n;f.reset();save();render();toast('Profil disimpan')}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='logout'){void logout();return}
if(a==='approve'){const task=S.tasks.find(x=>String(x.id)===id);if(!task||!task.result)return;updateTaskStatus(task,ST[3]);task.reviewed=true;task.h.push({at:Date.now(),t:'CEO menyetujui hasil kerja.'});log('CEO menyetujui hasil: '+task.t.slice(0,60));toast('Hasil disetujui.')}
else if(a==='revise'){const task=S.tasks.find(x=>String(x.id)===id);if(!task||!task.result)return;updateTaskStatus(task,ST[1]);task.reviewed=false;task.h.push({at:Date.now(),t:'CEO menandai hasil perlu revisi. Pengiriman ulang ke AI belum dilakukan.'});log('Hasil ditandai perlu revisi: '+task.t.slice(0,60));toast('Status diubah. Tugas belum dikirim ulang ke AI.')}
else if(a==='del'){S.tasks=S.tasks.filter(t=>String(t.id)!==id)}
else if(a==='delev'){S.events=S.events.filter(v=>String(v.id)!==id)}
else if(a==='cm'){cal.m=b.dataset.m}
else if(a==='cn'){const n=+b.dataset.n,d=new Date(cal.d);if(cal.m==='hari')d.setDate(d.getDate()+n);else if(cal.m==='minggu')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n,1);cal.d=d}
else if(a==='day'){cal={m:'hari',d:new Date(b.dataset.d+'T00:00:00')}}
else if(a==='rm'){rep=b.dataset.m}
else if(a==='srep'){const r=makeRep(rep);S.reports.unshift({title:r.title,body:r.body});log('Laporan disimpan: '+r.title);toast('Laporan disimpan')}
else if(a==='crep'){copy(makeRep(rep).body);return}
else if(a==='vrep'){const r=S.reports[+b.dataset.i];copy(r.title+'\n\n'+r.body);return}
else if(a==='backup-export'){downloadBackup();return}
else if(a==='reset'){if(!confirm('Hapus semua data NEXUS AI COMPANY di peramban ini?'))return;try{localStorage.removeItem(KEY)}catch(e){}load()}
save();render()});
document.addEventListener('change',async ev=>{const b=ev.target;if(b.id==='backup-file'){const file=b.files?.[0];if(!file)return;try{await importBackupFile(file)}catch(error){toast(error.message||'Gagal memulihkan backup.')}finally{b.value=''}return;}if(!b.dataset.a||!['st','pg'].includes(b.dataset.a))return;const k=S.tasks.find(t=>String(t.id)===b.dataset.id);if(!k)return;
if(b.dataset.a==='st'){updateTaskStatus(k,b.value);k.h.push({at:Date.now(),t:'Status menjadi '+k.st});log('Status “'+k.t.slice(0,40)+'”: '+k.st)}
else{updateTaskProgress(k,b.value);k.h.push({at:Date.now(),t:'Progres '+k.pg+'% · Status '+k.st});log('Progres tugas “'+k.t.slice(0,40)+'” menjadi '+k.pg+'%')}save();render()});
addEventListener('hashchange',render);load();render();refreshAIStatus();
</script></body></html>
