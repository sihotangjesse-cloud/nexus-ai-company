const E=[
{id:'sena',n:'Sena',r:'Team Leader',c:'#4cc3ff',d:'Mengatur pekerjaan tim, memilih spesialis yang relevan, mengumpulkan hasil, dan menyerahkannya kepada CEO untuk ditinjau.',k:['Koordinasi','Delegasi','Quality control','Pelaporan'],sys:'Kamu Sena, Team Leader. Pecah instruksi CEO menjadi tugas dan tunjuk spesialis yang relevan. Hasil spesialis harus ditinjau oleh CEO; jangan mengklaim pemeriksaan otomatis.'},
{id:'nara',n:'Nara',r:'Market Researcher',c:'#4be3a0',d:'Meneliti pasar, menganalisis kompetitor, menemukan peluang, dan memahami kebutuhan pelanggan.',k:['Riset pasar','Analisis kompetitor','Kebutuhan pelanggan'],sys:'Kamu Nara, Market Researcher. Jangan mengarang data. Sebutkan sumber atau nyatakan data belum tersedia.'},
{id:'juno',n:'Juno',r:'Creative Director',c:'#b69cff',d:'Menyusun strategi kreatif, konsep kampanye, dan arah ide konten.',k:['Strategi kreatif','Konsep kampanye','Ide konten'],sys:'Kamu Juno, Creative Director. Beri konsep besar dan arahan untuk tim kreatif.'},

function parseBackupText(text){
 if(typeof text!=='string'||new TextEncoder().encode(text).byteLength>MAX_BACKUP_BYTES)throw new Error('File backup terlalu besar. Batas maksimal 2 MB.');
 let payload;try{payload=JSON.parse(text)}catch(e){throw new Error('File backup bukan JSON yang valid.')}
 if(!isRecord(payload)||payload.format!==BACKUP_FORMAT||payload.version!==BACKUP_VERSION||!isRecord(payload.data))throw new Error('Format backup NEXUS tidak dikenal atau versinya tidak didukung.');
 return normalizeState(payload.data);
}

async function importBackupFile(file){

 if(file.size>MAX_BACKUP_BYTES)throw new Error('File backup terlalu besar. Batas maksimal 2 MB.');
 const restored=parseBackupText(await file.text());

}
function bytesToBase64(bytes){
 let binary='';
 for(let offset=0;offset<bytes.length;offset+=0x8000){
  binary+=String.fromCharCode(...bytes.subarray(offset,Math.min(offset+0x8000,bytes.length)));
 }
 return btoa(binary);
}
function base64ToBytes(value){
 if(typeof value!=='string'||!value||value.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(value))throw new Error('Data backup terenkripsi tidak valid.');
 const binary=atob(value);
 return Uint8Array.from(binary,char=>char.charCodeAt(0));
}
async function deriveBackupKey(password,salt,cryptoProvider=globalThis.crypto){
 if(typeof password!=='string'||password.length<12)throw new Error('Kata sandi backup harus minimal 12 karakter.');
 if(!cryptoProvider?.subtle)throw new Error('Browser ini tidak mendukung enkripsi backup. Gunakan Chrome atau Edge versi terbaru.');
 const material=await cryptoProvider.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return cryptoProvider.subtle.deriveKey(
  {name:'PBKDF2',salt,iterations:BACKUP_KDF_ITERATIONS,hash:'SHA-256'},
  material,
  {name:'AES-GCM',length:256},
  false,
  ['encrypt','decrypt']
 );
}
async function encryptBackupPayload(payload,password,cryptoProvider=globalThis.crypto){
 if(!cryptoProvider?.subtle||typeof cryptoProvider.getRandomValues!=='function')throw new Error('Browser ini tidak mendukung enkripsi backup. Gunakan Chrome atau Edge versi terbaru.');
 if(typeof password!=='string'||password.length<12)throw new Error('Kata sandi backup harus minimal 12 karakter.');
 const plaintext=new TextEncoder().encode(JSON.stringify(payload));
 if(plaintext.byteLength>MAX_BACKUP_BYTES)throw new Error('Data backup melebihi batas 2 MB. Hapus data lama atau gunakan backup yang lebih kecil.');
 const salt=cryptoProvider.getRandomValues(new Uint8Array(16));
 const iv=cryptoProvider.getRandomValues(new Uint8Array(12));
 const key=await deriveBackupKey(password,salt,cryptoProvider);
 const encrypted=await cryptoProvider.subtle.encrypt({name:'AES-GCM',iv,tagLength:128},key,plaintext);
 return {
  format:ENCRYPTED_BACKUP_FORMAT,
  version:ENCRYPTED_BACKUP_VERSION,
  cipher:'AES-256-GCM',
  kdf:'PBKDF2-SHA-256',
  iterations:BACKUP_KDF_ITERATIONS,
  salt:bytesToBase64(salt),
  iv:bytesToBase64(iv),
  ciphertext:bytesToBase64(new Uint8Array(encrypted)),
  exportedAt:new Date().toISOString()
 };
}
async function decryptBackupPayload(envelope,password,cryptoProvider=globalThis.crypto){
 if(!isRecord(envelope)||envelope.format!==ENCRYPTED_BACKUP_FORMAT||envelope.version!==ENCRYPTED_BACKUP_VERSION||
  envelope.cipher!=='AES-256-GCM'||envelope.kdf!=='PBKDF2-SHA-256'||envelope.iterations!==BACKUP_KDF_ITERATIONS){
  throw new Error('Format backup terenkripsi tidak dikenal atau versinya tidak didukung.');
 }
 if(typeof password!=='string'||password.length<12)throw new Error('Kata sandi backup harus minimal 12 karakter.');
 if(typeof envelope.ciphertext!=='string'||envelope.ciphertext.length>Math.ceil((MAX_BACKUP_BYTES+16)*4/3)+4){
  throw new Error('File backup terenkripsi terlalu besar atau tidak valid.');
 }
 const salt=base64ToBytes(envelope.salt),iv=base64ToBytes(envelope.iv),ciphertext=base64ToBytes(envelope.ciphertext);
 if(salt.length!==16||iv.length!==12||ciphertext.length<16||ciphertext.length>MAX_BACKUP_BYTES+16){
  throw new Error('Data backup terenkripsi tidak valid.');
 }
 const key=await deriveBackupKey(password,salt,cryptoProvider);
 try{
  const decrypted=await cryptoProvider.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,ciphertext);
  const text=new TextDecoder('utf-8',{fatal:true}).decode(decrypted);
  return JSON.parse(text);
 }catch(error){
  throw new Error('Kata sandi salah atau file backup terenkripsi rusak.');
 }
}

function getOperationalMetrics(tasks,employees,now=new Date()){
 const rows=(Array.isArray(tasks)?tasks:[]).filter(task=>task&&typeof task==='object');
 const year=now.getFullYear(),month=String(now.getMonth()+1).padStart(2,'0'),day=String(now.getDate()).padStart(2,'0');
 const today=year+'-'+month+'-'+day;
 const weekEnd=new Date(Date.UTC(year,now.getMonth(),now.getDate()+7)).toISOString().slice(0,10);
 const statusCounts={};
 ST.forEach(status=>{statusCounts[status]=rows.filter(task=>task.st===status).length});
 const progressOf=task=>Math.max(0,Math.min(100,Number.isFinite(Number(task.pg))?Number(task.pg):(task.st===ST[3]?100:0)));
 const isOpen=task=>task.st!==ST[3];
 const overdueTasks=rows.filter(task=>isOpen(task)&&/^\d{4}-\d{2}-\d{2}$/.test(String(task.due||''))&&task.due<today)
  .slice().sort((a,b)=>String(a.due).localeCompare(String(b.due)));
 const dueSoonTasks=rows.filter(task=>isOpen(task)&&/^\d{4}-\d{2}-\d{2}$/.test(String(task.due||''))&&task.due>=today&&task.due<=weekEnd)
  .slice().sort((a,b)=>String(a.due).localeCompare(String(b.due)));
 const completed=statusCounts[ST[3]]||0;
 const total=rows.length;
 const averageProgress=total?Math.round(rows.reduce((sum,task)=>sum+progressOf(task),0)/total):0;
 const employeeStats=(Array.isArray(employees)?employees:[]).map(employee=>{
  const assigned=rows.filter(task=>task.emp===employee.id);
  const completedTasks=assigned.filter(task=>task.st===ST[3]).length;
  const inProgress=assigned.filter(task=>task.st===ST[1]).length;
  const inReview=assigned.filter(task=>task.st===ST[2]).length;
  const queued=assigned.filter(task=>task.st===ST[0]).length;
  return {id:employee.id,name:employee.n,total:assigned.length,completed:completedTasks,inProgress,inReview,queued,
   completionRate:assigned.length?Math.round(completedTasks/assigned.length*100):0,
   averageProgress:assigned.length?Math.round(assigned.reduce((sum,task)=>sum+progressOf(task),0)/assigned.length):0};
 });
 return {total,completed,active:(statusCounts[ST[1]]||0)+(statusCounts[ST[2]]||0),
  inProgress:statusCounts[ST[1]]||0,inReview:statusCounts[ST[2]]||0,queued:statusCounts[ST[0]]||0,
  completionRate:total?Math.round(completed/total*100):0,averageProgress,
  overdue:overdueTasks.length,dueSoon:dueSoonTasks.length,today,weekEnd,
  statusCounts,employeeStats,overdueTasks,dueSoonTasks};
}

function updateTaskStatus(task,value){
 if(!ST.includes(value))return task;
 task.st=value;
 if(value===ST[0]){task.pg=0;task.reviewed=false;}
 else if(value===ST[1]){task.pg=Math.max(10,Math.min(89,Number(task.pg)||40));task.reviewed=false;}
 else if(value===ST[2]){task.pg=90;task.reviewed=false;}
 else{task.pg=100;task.reviewed=Boolean(task.result);}
 return task;
}
function updateTaskProgress(task,value){
 const progress=Math.max(0,Math.min(100,Math.round(Number(value)||0)));
 if(progress===0){task.pg=0;task.st=ST[0];task.reviewed=false;}
 else if(progress>=100){task.pg=100;task.st=ST[3];task.reviewed=Boolean(task.result);}
 else if(progress>=90){task.pg=90;task.st=ST[2];task.reviewed=false;}
 else{task.pg=progress;task.st=ST[1];task.reviewed=false;}
 return task;
}
function filterTasks(tasks,filters={}){
 const rows=Array.isArray(tasks)?tasks:[];
 const query=String(filters.query??'').trim().toLocaleLowerCase('id-ID');
 const terms=query?query.split(/\s+/).filter(Boolean):[];
 const filtered=rows.filter(task=>{
  if(!task||typeof task!=='object')return false;
  if(filters.status&&task.st!==filters.status)return false;
  if(filters.employee&&task.emp!==filters.employee)return false;
  if(filters.priority&&task.pri!==filters.priority)return false;
   if(filters.project&&String(task.projectId||'')!==String(filters.project))return false;
  if(terms.length){
   const searchable=[task.t,employeeName(task.emp),projectTitle(task.projectId),task.pri,task.st,task.due].map(value=>String(value??'')).join(' ').toLocaleLowerCase('id-ID');
   if(!terms.every(term=>searchable.includes(term)))return false;
  }
  return true;
 });
 const indexed=filtered.map((task,index)=>({task,index}));
 const sort=filters.sort||'newest';
 indexed.sort((left,right)=>{
  let order=0;
  if(sort==='due-asc'){
   const a=String(left.task.due||''),b=String(right.task.due||'');
   if(!a&&!b)order=0;
   else if(!a)order=1;
   else if(!b)order=-1;
   else order=a.localeCompare(b);
  }else if(sort==='priority-desc'){
   order=PR.indexOf(right.task.pri)-PR.indexOf(left.task.pri);
  }else if(sort==='newest'){
   const a=Number(left.task.id),b=Number(right.task.id);
   if(Number.isFinite(a)&&Number.isFinite(b))order=b-a;
  }
  return order||left.index-right.index;
 });
 return indexed.map(item=>item.task);
}

function applyTaskDetails(task,fields){
 if(!isRecord(task)||!isRecord(fields))return {ok:false,error:'Data tugas tidak valid.'};
 const title=String(fields.t??'').trim(),employeeId=String(fields.e??''),priority=String(fields.p??''),due=String(fields.d??''),projectId=fields.projectId===undefined?String(task.projectId||''):String(fields.projectId||'');
 if(title.length<3||title.length>160)return {ok:false,error:'Judul tugas harus berisi 3–160 karakter.'};
 if(!em(employeeId))return {ok:false,error:'Pilih karyawan yang tersedia.'};
 if(!PR.includes(priority))return {ok:false,error:'Prioritas tugas tidak valid.'};
 if(projectId&&!S.projects.some(project=>String(project.id)===projectId))return {ok:false,error:'Pilih proyek yang tersedia.'};
 if(due){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return {ok:false,error:'Format tenggat waktu tidak valid.'};
  const parsed=new Date(due+'T00:00:00Z');
  if(Number.isNaN(parsed.getTime())||parsed.toISOString().slice(0,10)!==due)return {ok:false,error:'Tanggal tenggat tidak valid.'};
 }
 const changes=[];
 if(task.t!==title)changes.push('judul');
 if(task.emp!==employeeId)changes.push('penanggung jawab');
 if(task.pri!==priority)changes.push('prioritas');
 if(task.due!==due)changes.push('tenggat');
 if(String(task.projectId||'')!==projectId)changes.push('proyek');
 if(!changes.length)return {ok:true,changed:false,reviewRequired:false,changes};
 task.t=title;task.emp=employeeId;task.pri=priority;task.due=due;task.projectId=projectId;
 const reviewRequired=Boolean(task.result)&&(changes.includes('judul')||changes.includes('penanggung jawab'));
 if(reviewRequired){updateTaskStatus(task,ST[2]);task.reviewed=false;}
 if(!Array.isArray(task.h))task.h=[];
 task.h.push({at:Date.now(),t:'Detail tugas diperbarui: '+changes.join(', ')+(reviewRequired?'. Hasil AI lama dipertahankan dan perlu diperiksa ulang.':'')});
 task.h=task.h.slice(-50);
 return {ok:true,changed:true,reviewRequired,changes};
}

async function api(path,payload){
if(PERSONAL_OFFLINE_MODE)throw new Error('Fitur ini memerlukan backend NEXUS. Mode pribadi offline tidak mengirim data ke server atau layanan AI.');

const controller=typeof AbortController!=='undefined'?new AbortController():null;
const timer=controller?setTimeout(()=>controller.abort(),timeout):null;
try{r=await fetch(path,{method:payload?'POST':'GET',credentials:'same-origin',headers:payload?{'Content-Type':'application/json'}:{},body:payload?JSON.stringify(payload):undefined,...(controller?{signal:controller.signal}:{})});}
catch(e){if(e.name==='TimeoutError'||e.name==='AbortError')throw new Error('Waktu tunggu habis. Periksa koneksi dan coba lagi.');throw new Error('Tidak dapat menghubungi backend NEXUS. Periksa koneksi server.')}
finally{if(timer)clearTimeout(timer)}
let data={};try{data=await r.json()}catch(e){}if(!r.ok){if(r.status===401&&AUTH.required&&path!=='/api/login'){AUTH.authenticated=false;render()}throw new Error(data.error||'Permintaan gagal. Coba lagi.')}return data}

function buildHistory(key,message=''){
const allowed=key==='company'?new Set(['ceo',...E.map(e=>e.id)]):new Set(['ceo','sena',key]);
const rows=(S.chats[key]||[]).filter(x=>allowed.has(x.f)).map(x=>{const raw=String(x.t||'');const isAssignment=key==='company'&&x.f!=='ceo'&&x.f!=='sena'&&raw.startsWith('Tugas: ');const role=(x.f==='ceo'||isAssignment||(key!=='company'&&key!=='sena'&&x.f==='sena'))?'user':'model';return {role,text:x.f==='ceo'?raw:`${em(x.f)?.n||'AI'}: ${raw}`}}).slice(-8);
let budget=2600;const bounded=[];
for(let i=rows.length-1;i>=0&&budget>0;i--){const raw=rows[i].text.trim();if(!raw)continue;const take=Math.min(900,budget);const text=raw.slice(0,take);bounded.push({role:rows[i].role,text});budget-=text.length}
let history=bounded.reverse();
// Measure UTF-8 bytes, not JavaScript characters. Keep a safety margin below
// the server's normalized request budget and discard oldest context first.
const payloadSize=()=>new TextEncoder().encode(JSON.stringify({message,history})).length;
while(history.length&&payloadSize()>12000)history.shift();
return history;
}
async function delegate(b,history=[]){push('company','ceo',b);save();render();

 markAIVerified(result.model);
 const due=''; // CEO sets a real deadline instead of receiving an invented date.
 push('company','sena',result.summary||'Rencana kerja selesai.');
 const assignments=Array.isArray(result.assignments)?result.assignments:[];
 const seen=new Set();
 assignments.slice(0,3).forEach(a=>{
  const e=em(a?.employeeId);
  if(!e||e.id==='sena'||seen.has(e.id))return;
  seen.add(e.id);
  if(a.success===true&&typeof a.response==='string'&&a.response.trim()){
   const brief=String(a.taskBrief||a.taskTitle||b).slice(0,2000);
   const task=addTask(a.taskTitle||e.r+': '+b.slice(0,60),e.id,'Sedang',due,ST[2],'Hasil AI tersimpan dan menunggu pemeriksaan CEO');
   task.brief=brief;
   task.result=a.response.slice(0,12000);
   task.reviewed=false;
   task.h.push({at:Date.now(),t:'Hasil spesialis tersimpan untuk pemeriksaan CEO'});
   push('company',e.id,'Tugas: '+brief);
   push('company',e.id,a.response);
   push(e.id,'sena','Tugas dari CEO: '+brief);
   push(e.id,e.id,a.response);
  }else{
   const reason=String(a.error||'Hasil belum tersedia.').slice(0,500);
   push('company','system',e.n+' belum menyelesaikan tugas: '+reason);
  }
 });
 if(typeof result.synthesis==='string'&&result.synthesis.trim()){push('company','sena','Sintesis Sena untuk CEO:\n\n'+result.synthesis.trim())}
 else if(result.synthesisError){push('company','system','Sena belum dapat menyusun sintesis akhir: '+String(result.synthesisError).slice(0,300)+' Hasil spesialis tetap tersimpan pada daftar tugas.')}
 const completed=assignments.filter(a=>a?.success===true&&typeof a.response==='string'&&a.response.trim()).length;
 log('Sena membagi instruksi. Hasil berhasil: '+completed+' dari '+assignments.length+' spesialis. Hasil tersimpan pada daftar tugas untuk review CEO.');
}catch(e){markAIFailed(e);push('company','system','Belum dapat memproses instruksi: '+e.message+' Pastikan backend dan konfigurasi API sudah aktif.');}
save();render()}

function csvCell(value){
 let text=value===null||value===undefined?'':String(value);

 return '"'+text.replace(/"/g,'""')+'"';

function serializeCsv(headers,rows){
 const all=[headers,...(Array.isArray(rows)?rows:[])];
 return '\uFEFF'+all.map(row=>headers.map((_,index)=>csvCell(Array.isArray(row)?row[index]:'')).join(',')).join('\r\n')+'\r\n';
}
function makeOperationalCsv(period,tasks,employees,activity,now=new Date()){
 const rows=Array.isArray(tasks)?tasks.filter(task=>task&&typeof task==='object'):[];
 const metrics=getOperationalMetrics(rows,employees,now);
 const windowMs=period==='harian'?864e5:7*864e5;
 const periodLabel=period==='harian'?'24 jam terakhir':'7 hari terakhir';
 const entries=(Array.isArray(activity)?activity:[]).filter(item=>{
  const at=Number(item?.at),stamp=new Date(at).getTime();
  return Number.isFinite(at)&&Number.isFinite(stamp)&&now.getTime()-stamp>=0&&now.getTime()-stamp<windowMs;
 });
 const headers=['Bagian','Metrik atau Item','Status','Penanggung Jawab','Prioritas','Tenggat','Progres (%)','Jumlah Tugas','Tugas Selesai','Persentase Selesai (%)','Waktu','Keterangan'];
 const data=[];
 const add=(section,item,status='',owner='',priority='',due='',progress='',total='',completed='',rate='',time='',note='')=>{
  data.push([section,item,status,owner,priority,due,progress,total,completed,rate,time,note]);
 };
 add('Ekspor','Dibuat pada','','','','','','','','',now.toISOString(),'Laporan operasional lokal');
 add('Ringkasan','Periode aktivitas','','','','','','','','','',periodLabel);
 add('Ringkasan','Total tugas','','','','','',metrics.total,'','','','Snapshot saat ekspor');
 add('Ringkasan','Tugas selesai','','','','','',metrics.total,metrics.completed,metrics.completionRate,'','Jumlah tugas dan persentase yang berstatus selesai');
 add('Ringkasan','Sedang dikerjakan','','','','','',metrics.inProgress,'','','','');
 add('Ringkasan','Menunggu pemeriksaan','','','','','',metrics.inReview,'','','','');
 add('Ringkasan','Belum dimulai','','','','','',metrics.queued,'','','','');
 add('Ringkasan','Tugas terlambat','','','','','',metrics.overdue,'','','','Tugas belum selesai dengan tenggat sebelum hari ini');
 add('Ringkasan','Tenggat dalam 7 hari','','','','','',metrics.dueSoon,'','','','Tugas belum selesai dengan tenggat hingga tujuh hari ke depan');
 add('Ringkasan','Rata-rata progres','','','','',metrics.averageProgress,'','','','','Rata-rata progres semua tugas');
 ST.forEach(status=>{
  const count=metrics.statusCounts[status]||0;
  add('Status',status,status,'','','','',count,'',metrics.total?Math.round(count/metrics.total*100):0,'','Jumlah tugas pada status ini');
 });
 metrics.employeeStats.forEach(employee=>{
  add('Karyawan',employee.name,'','','','',employee.averageProgress,employee.total,employee.completed,employee.completionRate,'',
   employee.inProgress+' dikerjakan; '+employee.inReview+' diperiksa; '+employee.queued+' tertunda');
 });
 const progressOf=task=>Math.max(0,Math.min(100,Number.isFinite(Number(task.pg))?Number(task.pg):(task.st===ST[3]?100:0)));
 metrics.overdueTasks.forEach(task=>{
  add('Tenggat',task.t,'Terlambat',employeeName(task.emp),task.pri,task.due,progressOf(task),'','','','','Perlu tindak lanjut');
 });
 metrics.dueSoonTasks.forEach(task=>{
  add('Tenggat',task.t,'Mendekati tenggat',employeeName(task.emp),task.pri,task.due,progressOf(task),'','','','','Tenggat dalam tujuh hari');
 });
 entries.sort((a,b)=>Number(b.at)-Number(a.at)).forEach(item=>{
  add('Aktivitas',String(item.t||'Aktivitas').slice(0,500),'','','','','','','','',new Date(Number(item.at)).toISOString(),'Catatan aktivitas lokal');
 });
 return serializeCsv(headers,data);
}
function makeTaskCsv(tasks,employees,now=new Date()){
 const rows=Array.isArray(tasks)?tasks.filter(task=>task&&typeof task==='object'):[];
 const metrics=getOperationalMetrics(rows,employees,now);
 const headers=['ID Tugas','Judul Tugas','Penanggung Jawab','Prioritas','Status','Tenggat','Kategori Tenggat','Progres (%)','Disetujui CEO'];
 const data=rows.map(task=>{
  let dueCategory='Tidak ada perhatian khusus';
  if(task.st!==ST[3]&&/^\d{4}-\d{2}-\d{2}$/.test(String(task.due||''))){
   if(task.due<metrics.today)dueCategory='Terlambat';
   else if(task.due<=metrics.weekEnd)dueCategory='Tenggat 7 hari';
  }
  const progress=Math.max(0,Math.min(100,Number.isFinite(Number(task.pg))?Number(task.pg):(task.st===ST[3]?100:0)));
  return [task.id??'',task.t??'',employeeName(task.emp),task.pri??'',task.st??'',task.due??'',dueCategory,progress,task.reviewed?'Ya':'Tidak'];
 });
 return serializeCsv(headers,data);
}
function downloadCsv(content,filename,message){
 const blob=new Blob([content],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');
 link.href=url;link.download=filename;
 document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
 toast(message);
}

function captureFormDrafts(){const root=$('#main');if(!root||typeof root.querySelectorAll!=='function')return [];const drafts=[];for(const form of root.querySelectorAll('form[data-f]')){for(const el of Array.from(form.elements||[])){if(!el.name||DRAFT_SKIP.has(el.type))continue;const value=String(el.value??'');if(value===controlDefault(el))continue;drafts.push({formType:form.dataset.f,key:form.dataset.key||'',name:el.name,value})}}return drafts}
function restoreFormState(drafts,focus){const root=$('#main');if(!root||typeof root.querySelectorAll!=='function')return;const forms=Array.from(root.querySelectorAll('form[data-f]'));const find=(type,key,name)=>{const form=forms.find(x=>x.dataset.f===type&&(x.dataset.key||'')===key);const field=form?.elements?.namedItem?.(name);return field&&!DRAFT_SKIP.has(field.type)?field:null};
for(const d of drafts||[]){const field=find(d.formType,d.key,d.name);if(field)field.value=d.value}
if(focus){const field=find(focus.formType,focus.key,focus.name);if(field&&typeof field.focus==='function'){field.focus();if(focus.start!==null&&typeof field.setSelectionRange==='function'){try{field.setSelectionRange(focus.start,focus.end)}catch(e){}}}}}
function render(){const drafts=captureFormDrafts(),saved=captureFocusedField();
if(AUTH.required&&!AUTH.authenticated&&!AUTH.checked){$('#nav').innerHTML='';$('#main').innerHTML='<div class="card" role="status" aria-live="polite"><p>Memeriksa sesi…</p></div>';return;}
if(AUTH.required&&!AUTH.authenticated){$('#nav').innerHTML='';$('#main').innerHTML=loginView();restoreFormState(drafts,saved);return;}
const h=(location.hash||'#dashboard').slice(1);const projectRoute=h.startsWith('p-')?projectById(h.slice(2)):null;
const v=h.startsWith('k-')&&em(h.slice(2))?'karyawan':projectRoute?'proyek':(V[h]?h:'dashboard');
$('#nav').innerHTML='<div class="nav-brand"><span class="brand-mark">'+svgIcon('sparkles')+'</span><div><strong>NEXUS PERSONAL</strong><small>RUANG KERJA PRIBADI</small></div></div>'+nav.map(n=>`<a href="#${n[0]}" class="${n[0]===v?'on':''}" ${n[0]===v?'aria-current="page"':''}><span class="nav-icon">${svgIcon(n[2])}</span><span>${n[1]}</span></a>`).join('');
$('#main').innerHTML=topHeader()+(PERSONAL_OFFLINE_MODE?`<div class="demo" role="note">${esc(PERSONAL_OFFLINE_NOTICE)}</div>`:'')+(h.startsWith('k-')&&em(h.slice(2))?V.emp(h.slice(2)):projectRoute?V.projectDetail(projectRoute.id):V[v]());
restoreFormState(drafts,saved);
const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
async function reviseTask(id,note){
 if(PERSONAL_OFFLINE_MODE){toast('Revisi AI tidak tersedia pada mode pribadi offline.');return}
 const key=String(id);const task=S.tasks.find(x=>String(x.id)===key);
 if(!task||!task.result||REVISING.has(key))return;
 const e=em(task.emp);if(!e){toast('Tugas ini belum ditugaskan ke karyawan AI.');return}
 const truncated=task.result.length>6000;
 REVISING.add(key);updateTaskStatus(task,ST[1]);
 task.h.push({at:Date.now(),t:'CEO meminta revisi: '+note.slice(0,300)+(truncated?' (hasil sebelumnya dipotong 6.000 karakter untuk dikirim)':'')});
 save();render();
 try{
  const result=await api('/api/revise',{employeeId:e.id,taskTitle:task.t,taskBrief:task.brief||'',previousResult:task.result.slice(0,6000),note:note.slice(0,2000)});
  markAIVerified(result.model);
  const reply=typeof result.reply==='string'?result.reply.trim():'';
  if(!reply)throw new Error('AI tidak mengembalikan hasil revisi.');
  task.result=reply.slice(0,12000);updateTaskStatus(task,ST[2]);task.reviewed=false;
  task.h.push({at:Date.now(),t:'Revisi diterima dari '+e.n+'. Menunggu pemeriksaan CEO.'});
  push(e.id,'ceo','Catatan revisi: '+note);push(e.id,e.id,reply);
  log('Revisi diterima dari '+e.n+': '+task.t.slice(0,60));
  toast('Revisi diterima. Silakan periksa hasilnya.');
 }catch(error){
  markAIFailed(error);updateTaskStatus(task,ST[2]);task.reviewed=false;
  task.h.push({at:Date.now(),t:'Revisi gagal: '+String(error.message||'Kesalahan tidak diketahui').slice(0,300)+' Hasil sebelumnya dipertahankan.'});
  toast('Revisi gagal. Hasil sebelumnya dipertahankan.');
 }finally{REVISING.delete(key);save();render()}
}
function err(t){const e=$('#err');if(e)e.textContent=t}
document.addEventListener('submit',async ev=>{const f=ev.target;const k=f.dataset.f;if(!k)return;ev.preventDefault();const d=new FormData(f);

 if(!NOTE_CATEGORIES.includes(category)){toast('Kategori catatan tidak valid.');return}
 if(S.notes.length>=100){toast('Batas 100 catatan tercapai. Hapus catatan lama sebelum menambah.');return}
 const now=Date.now();S.notes.unshift({id:now+Math.random(),title,body,category,createdAt:now,updatedAt:now,pinned:false});log('Catatan baru: '+title.slice(0,80));f.reset();save();render();toast('Catatan berhasil disimpan.');return;

 const name=String(d.get('name')||'').trim(),objective=String(d.get('objective')||'').trim(),type=String(d.get('type')||'company'),stack=String(d.get('stack')||'HTML, CSS, JavaScript').trim(),targetDate=String(d.get('targetDate')||'');
 if(name.length<3||name.length>100){toast('Nama proyek harus berisi 3–100 karakter.');return}
 if(objective.length<10){toast('Jelaskan tujuan website minimal 10 karakter.');return}

 if(targetDate){const date=new Date(targetDate+'T00:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)||Number.isNaN(date.getTime())||date.toISOString().slice(0,10)!==targetDate){toast('Target tanggal tidak valid.');return}}
 if(S.projects.length>=50||S.tasks.length>=480){toast('Batas data proyek atau tugas tercapai. Hapus data lama sebelum menambah proyek.');return}
 const project={id:Date.now()+Math.random(),name,type,objective,stack:stack.slice(0,160),targetDate,status:'Perencanaan',createdAt:Date.now(),site:defaultWebsiteContent({name,objective,type})};
 S.projects.unshift(project);
 const plan=buildWebsitePlan(project);
 plan.forEach(step=>addTask(step.title,step.emp,step.priority,'',ST[0],'Checklist awal proyek: '+name,String(project.id),step.brief));
 log('Proyek dibuat: '+name+' dengan '+plan.length+' tugas awal.');
 f.reset();save();location.hash='#p-'+project.id;render();toast('Proyek dibuat dengan '+plan.length+' tugas checklist.');return;
}
if(k==='site-editor'){
 const project=projectById(f.dataset.key);
 if(!project){toast('Proyek tidak ditemukan.');return}
 project.site=websiteContentFromForm(f,project);
 log('Konten Website Studio disimpan: '+project.name);
 save();render();toast('Konten website berhasil disimpan.');return;
}
if(k==='edit-project'){
 const project=projectById(f.dataset.key),name=String(d.get('name')||'').trim(),objective=String(d.get('objective')||'').trim(),type=String(d.get('type')||''),stack=String(d.get('stack')||'').trim(),targetDate=String(d.get('targetDate')||''),status=String(d.get('status')||'');
 if(!project){toast('Proyek tidak ditemukan.');return}
 if(name.length<3||name.length>100||objective.length<10){toast('Periksa nama dan tujuan proyek.');return}
 if(!WEBSITE_TYPES.some(item=>item.id===type)||!PROJECT_STATUSES.includes(status)){toast('Jenis atau status proyek tidak valid.');return}
 if(targetDate){const date=new Date(targetDate+'T00:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)||Number.isNaN(date.getTime())||date.toISOString().slice(0,10)!==targetDate){toast('Target tanggal tidak valid.');return}}
 project.name=name;project.type=type;project.objective=objective;project.stack=stack.slice(0,160);project.targetDate=targetDate;project.status=status;
 log('Detail proyek diperbarui: '+name);save();render();toast('Detail proyek disimpan.');return;
}
if(k==='encrypted-backup-export'){
 const password=String(d.get('password')||''),confirmation=String(d.get('confirmPassword')||'');
 const passwordField=f.elements?.namedItem?.('password'),confirmField=f.elements?.namedItem?.('confirmPassword');
 if(password.length<12){toast('Kata sandi backup harus minimal 12 karakter.');return}
 if(password!==confirmation){toast('Kedua kata sandi tidak sama.');return}
 if(passwordField)passwordField.value='';if(confirmField)confirmField.value='';
 try{
  const envelope=await encryptBackupPayload(createBackupPayload(),password);
  downloadEncryptedBackup(envelope);
 }catch(error){toast(error.message||'Gagal membuat backup terenkripsi.')}
 finally{if(passwordField)passwordField.value='';if(confirmField)confirmField.value='';}
 return;
}
if(k==='encrypted-backup-import'){
 const fileField=f.elements?.namedItem?.('file'),passwordField=f.elements?.namedItem?.('password');
 const file=fileField?.files?.[0],password=String(d.get('password')||'');
 if(!file){toast('Pilih file backup terenkripsi terlebih dahulu.');return}
 if(passwordField)passwordField.value='';
 try{
  if(file.size>MAX_ENCRYPTED_BACKUP_BYTES)throw new Error('File backup terenkripsi terlalu besar. Batas maksimal 3 MB.');
  const envelopeText=await file.text();
  if(new TextEncoder().encode(envelopeText).byteLength>MAX_ENCRYPTED_BACKUP_BYTES)throw new Error('File backup terenkripsi terlalu besar. Batas maksimal 3 MB.');
  let envelope;try{envelope=JSON.parse(envelopeText)}catch(error){throw new Error('File backup terenkripsi bukan JSON yang valid.')}
  const payload=await decryptBackupPayload(envelope,password);
  const restored=parseBackupText(JSON.stringify(payload));
  if(!confirm('Pulihkan backup terenkripsi ini? Data NEXUS saat ini akan diganti dengan isi backup.'))return;
  S=restored;log('Data dipulihkan dari backup terenkripsi lokal.');
  save();render();toast('Backup terenkripsi berhasil dipulihkan.');
 }catch(error){toast(error.message||'Gagal memulihkan backup terenkripsi.')}
 finally{if(passwordField)passwordField.value='';if(fileField)fileField.value='';}
 return;
}
if(k==='login'){const password=String(d.get('password')||'');const passwordField=f.elements?.namedItem?.('password');if(passwordField)passwordField.value='';try{await api('/api/login',{password});AUTH.authenticated=true;AUTH.error='';f.reset();await refreshAIStatus();toast('Berhasil masuk.')}catch(e){AUTH.error=e.message;render()}return}
if(k==='edit-task'){
 const task=S.tasks.find(x=>String(x.id)===(f.dataset.key||''));
 if(!task){toast('Tugas tidak ditemukan.');return}
 const result=applyTaskDetails(task,{t:d.get('t'),e:d.get('e'),p:d.get('p'),d:d.get('d')});
 if(!result.ok){toast(result.error);return}
 if(!result.changed){toast('Tidak ada perubahan pada detail tugas.');return}
 log('Detail tugas diperbarui: '+task.t.slice(0,60)+' ('+result.changes.join(', ')+').');
 f.reset();save();render();
 toast(result.reviewRequired?'Detail diperbarui. Hasil AI kembali menunggu pemeriksaan CEO.':'Detail tugas berhasil diperbarui.');
 return;
}
if(k==='revise'){const note=(d.get('note')||'').trim();if(note.length<2){toast('Tulis catatan revisi minimal 2 karakter.');return}const field=f.elements?.namedItem?.('note');if(field)field.value='';await reviseTask(f.dataset.key,note);return}
if(k==='chat'){const b=(d.get('m')||'').trim();if(b.length<2)return err('Tulis pesan minimal 2 karakter.');const key=f.dataset.key;if(BUSY.has(key))return;const field=f.elements?.namedItem?.('m');if(field)field.value='';if(PERSONAL_OFFLINE_MODE){push(key,'ceo',b);push(key,key==='company'?'sena':key,offlineAssistantReply(key,b));log('Template kerja offline digunakan oleh '+(key==='company'?'tim virtual':employeeName(key))+'.');save();render();return}const history=buildHistory(key,b);BUSY.add(key);render();try{if(key==='company')await delegate(b,history);else await talkToEmployee(key,b,history)}finally{BUSY.delete(key);save();render()}}
else if(k==='task'){const t=(d.get('t')||'').trim(),due=d.get('d'),projectId=d.get('projectId')||'';if(t.length<3)return err('Judul tugas minimal 3 karakter.');if(projectId&&!projectById(projectId))return err('Pilih proyek yang tersedia.');addTask(t,d.get('e'),d.get('p'),due,ST[0],'Tugas dibuat',projectId);log('Tugas baru: '+t);f.reset();save();render();toast('Tugas dibuat')}
else if(k==='ev'){const t=(d.get('t')||'').trim();if(t.length<2)return err('Judul agenda minimal 2 karakter.');if(!d.get('d'))return err('Pilih tanggal.');S.events.push({id:Date.now(),title:t,date:d.get('d'),type:d.get('y')});log('Agenda baru: '+t);f.reset();save();render()}
else if(k==='ceo'){const n=(d.get('n')||'').trim();if(!n)return err('Nama tidak boleh kosong.');S.ceo=n;f.reset();save();render();toast('Profil disimpan')}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='logout'){void logout();return}
if(a==='pin-note'){const note=S.notes.find(item=>String(item.id)===String(id));if(!note)return;note.pinned=!note.pinned;note.updatedAt=Date.now();log((note.pinned?'Catatan dipin: ':'Pin catatan dilepas: ')+note.title.slice(0,80));save();render();return}
if(a==='delete-note'){const note=S.notes.find(item=>String(item.id)===String(id));if(!note||!confirm('Hapus catatan “'+note.title+'”?'))return;S.notes=S.notes.filter(item=>String(item.id)!==String(id));log('Catatan dihapus: '+note.title.slice(0,80));save();render();return}
if(a==='download-starter'){const project=projectById(id);if(project){const form=document.querySelector('form[data-f="site-editor"]');const site=form&&String(form.dataset.key)===String(id)?websiteContentFromForm(form,project):project.site;downloadWebsiteStarter(project,site);}return}
if(a==='delete-project'){const project=projectById(id);if(!project)return;if(!confirm('Hapus proyek ini? Tugasnya tetap disimpan tanpa tautan proyek.'))return;S.projects=S.projects.filter(item=>String(item.id)!==String(id));S.tasks.forEach(task=>{if(String(task.projectId||'')===String(id))task.projectId=''});log('Proyek dihapus, tugas terkait tetap dipertahankan: '+project.name);location.hash='#proyek';save();render();return}
if(a==='approve'){const task=S.tasks.find(x=>String(x.id)===id);if(!task||!task.result)return;updateTaskStatus(task,ST[3]);task.reviewed=true;task.h.push({at:Date.now(),t:'CEO menyetujui hasil kerja.'});log('CEO menyetujui hasil: '+task.t.slice(0,60));toast('Hasil disetujui.')}
else if(a==='revise'){const task=S.tasks.find(x=>String(x.id)===id);if(!task||!task.result)return;updateTaskStatus(task,ST[1]);task.reviewed=false;task.h.push({at:Date.now(),t:'CEO menandai hasil perlu revisi. Pengiriman ulang ke AI belum dilakukan.'});log('Hasil ditandai perlu revisi: '+task.t.slice(0,60));toast('Status diubah. Tugas belum dikirim ulang ke AI.')}
else if(a==='reset-task-filters'){taskFilters={query:'',status:'',employee:'',priority:'',project:'',sort:'newest'};document.querySelectorAll('[data-task-filter]').forEach(field=>{field.value=taskFilters[field.dataset.taskFilter]??''});refreshTaskResults();return}
else if(a==='del'){S.tasks=S.tasks.filter(t=>String(t.id)!==id)}
else if(a==='delev'){S.events=S.events.filter(v=>String(v.id)!==id)}
else if(a==='cm'){cal.m=b.dataset.m}
else if(a==='cn'){const n=+b.dataset.n,d=new Date(cal.d);if(cal.m==='hari')d.setDate(d.getDate()+n);else if(cal.m==='minggu')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n,1);cal.d=d}
else if(a==='day'){cal={m:'hari',d:new Date(b.dataset.d+'T00:00:00')}}
else if(a==='rm'){rep=b.dataset.m}
else if(a==='srep'){const r=makeRep(rep);S.reports.unshift({title:r.title,body:r.body});log('Laporan disimpan: '+r.title);toast('Laporan disimpan')}
else if(a==='csv-report'){const date=dk(new Date());downloadCsv(makeOperationalCsv(rep,S.tasks,E,S.log,new Date()),'nexus-laporan-operasional-'+rep+'-'+date+'.csv','Laporan operasional CSV berhasil diunduh.');return}
else if(a==='csv-tasks'){const date=dk(new Date());downloadCsv(makeTaskCsv(S.tasks,E,new Date()),'nexus-detail-tugas-'+date+'.csv','Detail tugas CSV berhasil diunduh.');return}
else if(a==='crep'){copy(makeRep(rep).body);return}
else if(a==='vrep'){const r=S.reports[+b.dataset.i];copy(r.title+'\n\n'+r.body);return}
else if(a==='backup-export'){downloadBackup();return}
else if(a==='reset'){if(!confirm('Hapus semua data NEXUS PERSONAL di peramban ini?'))return;try{localStorage.removeItem(KEY)}catch(e){}load()}
save();render()});
