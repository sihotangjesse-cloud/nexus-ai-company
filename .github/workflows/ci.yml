name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/v0.3.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22 checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify required backend dependencies
        run: node -e "for (const p of ['express','helmet','express-rate-limit','dotenv']) { require.resolve(p); }"
      - name: Run syntax and frontend checks
        run: npm run check
      - name: Run complete test suite
        env:
          CI: "true"
        run: npm test
