name: Bootstrap NEXUS AI COMPANY v0.3.5

on:
  push:
    branches: [release/v0.3.5]

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore source package and remove bootstrap files
        run: |
          set -euo pipefail
          test ! -f package.json
          cat .github/bootstrap/nexus-source.part* | base64 --decode > /tmp/nexus-source.tar.xz
          tar -xJf /tmp/nexus-source.tar.xz -C .
          rm -rf .github/bootstrap .github/workflows/bootstrap-import.yml
          rm -f README.Md
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Run complete test suite
        run: npm test
      - name: Commit imported source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import NEXUS AI COMPANY v0.3.5 and lockfile"
          git push
